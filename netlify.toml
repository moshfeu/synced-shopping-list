[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[template.environment]
  VITE_API_KEY = "apiKey"
  VITE_AUTH_DOMAIN = "authDomain"
  VITE_DATABASE_URL = "databaseURL"
  VITE_PROJECT_ID = "projectId"
  VITE_STORAGE_BUCKET = "storageBucket"
  VITE_MESSAGING_SENDER_ID = "messagingSenderId"
  VITE_APP_ID = "appId"
  VITE_NOTIFICATION_TOKEN = "notificationToken"
  VITE_GOOGLE_IMAGES_TOKEN = "googleImagesToken"
  VITE_CUSTOMABLE_SEARCH_ENGINE_ID = "customableSearchEngineId"
  VITE_FUNCTIONS_BASE_URL="functionsBaseUrl"
[functions]
  node_bundler = "esbuild"